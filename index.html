<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薪水計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f8f6;
    --card: #ffffff;
    --border: #dde5e0;
    --fg: #0e1411;
    --muted: #66726c;
    --track: #e6ece8;
    --accent: #12a14b;
    --accent-dim: rgba(18, 161, 75, .45);
    --on-accent: #ffffff;
    --amber: #c98a00;
    --danger: #d23b40;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1110;
      --card: #151918;
      --border: #232927;
      --fg: #f2f5f3;
      --muted: #8f9a95;
      --track: #222927;
      --accent: #84e8a7;
      --accent-dim: rgba(132, 232, 167, .5);
      --on-accent: #06210f;
      --amber: #f0b429;
      --danger: #ff7a7f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1110;
    --card: #151918;
    --border: #232927;
    --fg: #f2f5f3;
    --muted: #8f9a95;
    --track: #222927;
    --accent: #84e8a7;
    --accent-dim: rgba(132, 232, 167, .5);
    --on-accent: #06210f;
    --amber: #f0b429;
    --danger: #ff7a7f;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .page { max-width: 700px; margin: 0 auto; padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 40px; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .brand i { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); display: block; }
  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .seg { display: flex; padding: 3px; gap: 2px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
  .seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 11px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--card); border-radius: 12px; color: var(--fg); }
  .icon-btn:hover { border-color: var(--muted); }
  svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* hero */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--muted); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: block; }
  .pill[data-state="lunch"] i { background: var(--amber); }
  .pill[data-state="off"] i, .pill[data-state="paused"] i { background: var(--muted); }
  .lead { margin: 28px 0 0; color: var(--muted); font-size: 15px; }
  .big { display: flex; align-items: baseline; justify-content: center; margin-top: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.05; max-width: 100%; }
  .big .cur { font-size: clamp(22px, 6vw, 44px); color: var(--muted); margin-right: 10px; }
  .big .int { font-size: clamp(56px, 17vw, 124px); font-weight: 700; color: var(--accent); letter-spacing: -0.03em; }
  .big .dec { font-size: clamp(28px, 8vw, 60px); font-weight: 500; color: var(--accent-dim); }
  .clock { margin-top: 26px; font-family: var(--mono); font-size: clamp(28px, 6vw, 40px); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day-bar { width: min(100%, 360px); margin-top: 22px; }
  .day-bar .legend { display: grid; grid-template-columns: 1fr auto 1fr; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day-bar .legend span:first-child { text-align: left; }
  .day-bar .legend span:last-child { text-align: right; }
  .controls { margin-top: 22px; display: flex; gap: 10px; }
  .notice { width: min(100%, 360px); margin-top: 20px; border: 1px solid var(--border); background: var(--card); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .notice .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
  .chip:hover { border-color: var(--muted); }
  .chip.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  .btn { border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 20px; font-size: 14px; }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .track { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .track.sm { height: 8px; }
  .track.xs { height: 4px; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); width: 0; transition: width .3s; }
  .fill.soft { background: var(--accent-dim); }

  /* cards */
  .card { border: 1px solid var(--border); background: var(--card); border-radius: 20px; }
  .month { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .row h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .small { font-size: 12px; color: var(--muted); }
  .scale { display: grid; grid-template-columns: 1fr auto 1fr; margin-top: 10px; }
  .scale span:last-child { text-align: right; }
  .divider { border: 0; border-top: 1px solid var(--border); margin: 0; }
  .earned { font-size: 18px; font-weight: 700; color: var(--accent); }
  .earned small { font-weight: 400; font-size: 13px; color: var(--muted); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); overflow: hidden; }
  .stat { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--border); min-width: 0; }
  .stat:first-child { border-left: 0; }
  .stat .label { font-size: 13px; color: var(--muted); }
  .stat .val { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .val sup { font-size: 12px; color: var(--muted); vertical-align: baseline; margin-right: 4px; }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--border); }
  }

  /* section header */
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; margin-bottom: 14px; }
  .sec-head h3 { margin: 0; font-size: 15px; font-weight: 500; color: var(--muted); }
  .edit-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .edit-btn:hover { background: var(--track); }

  /* goal */
  .goal { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .goal-title { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .goal-view { display: flex; flex-direction: column; gap: 14px; }
  .goal-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .goal-name { font-size: 19px; font-weight: 600; }
  .goal-msg { font-size: 13px; color: var(--muted); }
  .goal-msg.done { color: var(--accent); }
  .form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); flex: 1; min-width: 120px; }
  .field input, .field select { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; }

  /* buy */
  .buy-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 560px) { .buy-grid { grid-template-columns: repeat(2, 1fr); } }
  .buy { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px; min-width: 0; }
  .buy-top { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .buy-top svg.ic { width: 16px; height: 16px; }
  .buy-main { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
  .buy-main .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; }
  .buy-main .u { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .empty { grid-column: 1 / -1; padding: 22px; text-align: center; font-size: 14px; color: var(--muted); border: 1px dashed var(--border); border-radius: 16px; }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .item-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 14px; }
  .item-row .field { min-width: 0; flex: none; }
  .item-row .f-icon { width: 96px; }
  .item-row .f-unit { width: 64px; }
  .item-row .f-name { flex: 1; min-width: 100px; }
  .item-row .f-price { width: 100px; }
  .del { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; color: var(--muted); }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .actions .left { display: flex; gap: 8px; flex-wrap: wrap; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 10px 0 0; }

  .foot-wrap { display: flex; flex-direction: column; gap: 8px; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }
  .foot.copy { font-size: 12px; opacity: .75; }

  /* dialog */
  dialog { width: min(92vw, 440px); border: 1px solid var(--border); border-radius: 20px; background: var(--card); color: var(--fg); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 16px; font-size: 17px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 14px 0 12px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1 class="sr-only">薪水計時器</h1>
    <div class="seg" role="group" aria-label="計時模式">
      <button id="modeToday" aria-pressed="true">今日上班</button>
      <button id="modeCustom" aria-pressed="false">自訂計時</button>
    </div>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" aria-label="切換主題"></button>
      <button class="icon-btn" id="fsBtn" aria-label="全螢幕">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="setBtn" aria-label="設定">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main style="display:contents">
    <section class="hero">
      <div class="pill" id="pill" data-state="working"><i></i><span id="pillText">上班中</span></div>
      <p class="lead" id="lead">你以為你失去的是時間，其實你得到的是薪水</p>
      <div class="big" aria-label="已賺金額">
        <span class="cur">NT$</span><span class="int" id="heroInt">0</span><span class="dec" id="heroDec">.00</span>
      </div>
      <div class="clock" id="clock">00:00:00</div>

      <div class="day-bar" id="dayBar">
        <div class="track sm" role="progressbar" aria-label="今日工時進度" aria-valuemin="0" aria-valuemax="100" id="dayTrack"><div class="fill" id="dayFill"></div></div>
        <div class="legend"><span id="startLbl">09:00</span><span id="leftLbl"></span><span id="endLbl">18:00</span></div>
      </div>

      <div class="notice" id="notice" hidden>
        <span id="noticeText"></span>
        <div class="btns">
          <button class="chip" id="noticeAdjust">調整上班時間</button>
          <button class="chip primary" id="noticeCustom">改用自訂計時</button>
        </div>
      </div>

      <div class="controls" id="controls" hidden>
        <button class="btn primary" id="cStart">開始</button>
        <button class="btn" id="cReset">重設</button>
      </div>
    </section>

    <section class="card month" aria-labelledby="monthTitle">
      <div>
        <div class="row">
          <h2 id="monthTitle">10 月進度</h2>
          <span class="small mono" id="monthPassed"></span>
        </div>
        <div style="margin-top:16px">
          <div class="track" role="progressbar" aria-label="本月時間進度" aria-valuemin="0" aria-valuemax="100" id="monthTrack"><div class="fill" id="monthFill"></div></div>
          <div class="scale small mono"><span id="mStart">10/1</span><span id="mPct">0%</span><span id="mEnd">10/31</span></div>
        </div>
      </div>
      <hr class="divider">
      <div>
        <div class="row">
          <h2>本月已入帳</h2>
          <span class="earned mono">NT$<span id="monthEarned">0.00</span> <small>/ <span id="monthTotal">0</span></small></span>
        </div>
        <div style="margin-top:14px">
          <div class="track sm"><div class="fill soft" id="monthEarnFill"></div></div>
        </div>
      </div>
    </section>

    <section class="card stats" aria-label="薪資換算">
      <div class="stat"><span class="label">每秒</span><span class="val"><sup>NT$</sup><span id="sSec"></span></span></div>
      <div class="stat"><span class="label">每分鐘</span><span class="val"><sup>NT$</sup><span id="sMin"></span></span></div>
      <div class="stat"><span class="label">每小時</span><span class="val"><sup>NT$</sup><span id="sHour"></span></span></div>
      <div class="stat"><span class="label">日薪</span><span class="val"><sup>NT$</sup><span id="sDay"></span></span></div>
    </section>

    <section>
      <div class="sec-head"><h3>我的目標</h3></div>
      <div class="card goal">
        <div class="goal-head">
          <div class="goal-title">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9zM6 15l.7 1.6 1.6.7-1.6.7L6 19.6 5.3 18l-1.6-.7 1.6-.7z"/></svg>
            今日小目標
          </div>
          <button class="edit-btn" id="goalEdit"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span id="goalEditText">編輯</span></button>
        </div>

        <div class="goal-view" id="goalView">
          <div class="goal-row"><div class="goal-name" id="goalName"></div><span class="mono small" id="goalAmt" style="font-size:14px"></span></div>
          <div class="track sm"><div class="fill" id="goalFill"></div></div>
          <div class="goal-msg" id="goalMsg"></div>
        </div>

        <div class="form" id="goalForm" hidden>
          <label class="field">目標名稱<input id="gName" maxlength="20" autocomplete="off"></label>
          <label class="field" style="max-width:160px">金額 NT$<input id="gAmount" type="number" inputmode="numeric" min="1" step="10"></label>
          <button class="btn primary" id="gSave">儲存</button>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <h3>已經可以買</h3>
        <button class="edit-btn" id="buyEdit"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span id="buyEditText">編輯</span></button>
      </div>
      <div class="buy-grid" id="buyGrid"></div>
      <div id="buyEditor" hidden>
        <div class="rows" id="buyRows"></div>
        <p class="err" id="buyErr" role="alert"></p>
        <div class="actions">
          <div class="left">
            <button class="btn" id="buyAdd">新增品項</button>
            <button class="btn" id="buyReset">恢復預設</button>
          </div>
          <button class="btn primary" id="buySave">儲存</button>
        </div>
      </div>
    </section>

    <footer class="foot-wrap">
      <p class="foot" id="foot"></p>
      <p class="foot copy">© 2026 Real-Time Salary Ticker. All rights reserved.</p>
    </footer>
  </main>
</div>

<dialog id="dlg">
  <h2>設定</h2>
  <div class="grid2">
    <label class="field">月薪 NT$<input id="fSalary" type="number" inputmode="numeric" min="0" step="1000"></label>
    <label class="field">每月上班天數<input id="fDays" type="number" inputmode="numeric" min="1" max="31"></label>
    <label class="field">上班時間<input id="fStart" type="time"></label>
    <label class="field">下班時間<input id="fEnd" type="time"></label>
  </div>
  <label class="check"><input type="checkbox" id="fLunch"> 午休不計薪</label>
  <div class="grid2">
    <label class="field">午休開始<input id="fLs" type="time"></label>
    <label class="field">午休結束<input id="fLe" type="time"></label>
  </div>
  <p class="err" id="err" role="alert"></p>
  <div class="dlg-actions">
    <button class="btn" id="dCancel">取消</button>
    <button class="btn primary" id="dSave">儲存</button>
  </div>
</dialog>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = 'salary-timer-v1';
  const MAX_ITEMS = 8;
  const clone = (o) => JSON.parse(JSON.stringify(o));

  /* ---------- icons ---------- */
  const ICONS = {
    drink: '<path d="M6 8h12l-1.5 12h-9z"/><path d="M5 8h14"/><path d="M13 8l2-5"/>',
    coffee: '<path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 4v2M12 4v2"/>',
    meal: '<path d="M6 3v7a2 2 0 0 0 2 2v9"/><path d="M10 3v7a2 2 0 0 1-2 2"/><path d="M17 3c-2 2-3 4.5-3 7.5h3V21"/>',
    film: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/>',
    bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    game: '<rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 11v3M6.5 12.5h3"/><circle cx="15.5" cy="12" r=".6"/><circle cx="17.5" cy="13.5" r=".6"/>',
    book: '<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
    gift: '<rect x="4" y="9" width="16" height="11" rx="1"/><path d="M3 9h18M12 9v11"/><path d="M12 9c-1.5 0-3.500-.5-3.500-2.200A2 2 0 0 1 12 6c0 1.500 0 3 0 3zM12 9c1.500 0 3.500-.5 3.500-2.200A2 2 0 0 0 12 6"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  };
  const ICON_OPTS = [['drink', '飲料'], ['coffee', '咖啡'], ['meal', '餐點'], ['film', '電影'], ['bag', '購物'], ['game', '遊戲'], ['book', '書籍'], ['gift', '禮物']];
  const svg = (name) => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.bag) + '</svg>';

  /* ---------- state ---------- */
  const DEFAULT_ITEMS = [
    { icon: 'drink', unit: '杯', name: '珍奶', price: 65 },
    { icon: 'coffee', unit: '杯', name: '拿鐵', price: 120 },
    { icon: 'meal', unit: '個', name: '便當', price: 110 },
    { icon: 'film', unit: '張', name: '電影票', price: 320 },
  ];
  const defaults = {
    salary: 45000, days: 22, start: '09:00', end: '18:00',
    lunch: true, ls: '12:00', le: '13:00',
    goal: { name: '下班吃燒肉', amount: 800 },
    items: DEFAULT_ITEMS,
  };
  let cfg = clone(defaults);
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      Object.assign(cfg, saved);
      cfg.goal = Object.assign({}, defaults.goal, saved.goal || {});
      if (!Array.isArray(cfg.items)) cfg.items = clone(DEFAULT_ITEMS);
    }
  } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };

  let mode = 'today';
  const custom = { accum: 0, startedAt: null };

  /* ---------- helpers ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const hms = (s) => { s = Math.max(0, Math.floor(s)); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
  const money = (n, d = 2) => Math.max(0, n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const toSec = (t) => { const [h, m] = t.split(':').map(Number); return h * 3600 + m * 60; };
  const setText = (el, v) => { if (el.textContent !== v) el.textContent = v; };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach((c) => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
    return el;
  }

  function derived() {
    const s = toSec(cfg.start), e = toSec(cfg.end);
    const ls = toSec(cfg.ls), le = toSec(cfg.le);
    const lunchLen = cfg.lunch ? Math.max(0, Math.min(le, e) - Math.max(ls, s)) : 0;
    const workSecs = Math.max(1, e - s - lunchLen);
    const daily = cfg.salary / Math.max(1, cfg.days);
    const perSec = daily / workSecs;
    return { s, e, ls, le, workSecs, daily, perSec };
  }

  function workedAt(sec, d) {
    const t = Math.min(Math.max(sec, d.s), d.e);
    let w = t - d.s;
    if (cfg.lunch) w -= Math.max(0, Math.min(t, d.le) - Math.max(d.ls, d.s));
    return Math.max(0, w);
  }

  function getMonthProgress(now) {
    const date = new Date(now);
    const year = date.getFullYear(), month = date.getMonth();
    const start = new Date(year, month, 1).getTime();
    const end = new Date(year, month + 1, 1).getTime();
    return {
      month: month + 1,
      totalDays: new Date(year, month + 1, 0).getDate(),
      progress: (now - start) / (end - start),
      elapsedDays: Math.floor((now - start) / 86400000),
    };
  }

  /* ---------- buy cards ---------- */
  let buyRefs = [];
  function renderBuy() {
    const grid = $('buyGrid');
    grid.replaceChildren();
    buyRefs = [];
    if (!cfg.items.length) {
      grid.append(h('div', { class: 'empty' }, '還沒有品項，按右上角「編輯」新增一個。'));
      return;
    }
    cfg.items.forEach((it) => {
      const n = h('span', { class: 'n' }, '0');
      const fill = h('div', { class: 'fill' });
      grid.append(
        h('div', { class: 'card buy' },
          h('div', { class: 'buy-top', html: svg(it.icon) }, h('span', null, 'NT$' + Number(it.price).toLocaleString('en-US'))),
          h('div', { class: 'buy-main' }, n, h('span', { class: 'u' }, (it.unit || '') + it.name)),
          h('div', { class: 'track xs' }, fill)
        )
      );
      buyRefs.push({ n, fill, price: it.price });
    });
  }

  /* ---------- tick ---------- */
  function tick() {
    const now = Date.now();
    const dt = new Date(now);
    const d = derived();
    const secOfDay = dt.getHours() * 3600 + dt.getMinutes() * 60 + dt.getSeconds() + dt.getMilliseconds() / 1000;

    let earned, clockText, state, stateText;

    if (mode === 'today') {
      const worked = workedAt(secOfDay, d);
      earned = worked * d.perSec;
      clockText = hms(worked);
      const frac = worked / d.workSecs;
      $('dayFill').style.width = (frac * 100).toFixed(2) + '%';
      $('dayTrack').setAttribute('aria-valuenow', (frac * 100).toFixed(0));
      let leftLbl;
      if (secOfDay < d.s) { state = 'off'; stateText = '尚未上班'; leftLbl = '距離上班 ' + hms(d.s - secOfDay); }
      else if (secOfDay >= d.e) { state = 'off'; stateText = '已下班'; leftLbl = '恭喜下班！'; }
      else if (cfg.lunch && secOfDay >= d.ls && secOfDay < d.le) { state = 'lunch'; stateText = '午休中'; leftLbl = '距離下班 ' + hms(d.e - secOfDay); }
      else { state = 'working'; stateText = '上班中'; leftLbl = '距離下班 ' + hms(d.e - secOfDay); }
      setText($('leftLbl'), leftLbl);
      $('notice').hidden = state !== 'off';
      if (state === 'off') {
        setText($('noticeText'), '現在時間 ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + '，不在上班時段(' + cfg.start + '–' + cfg.end + ')，金額會在上班時間自動開始跳動。');
      }
    } else {
      const el = custom.accum + (custom.startedAt ? (now - custom.startedAt) / 1000 : 0);
      earned = el * d.perSec;
      clockText = hms(el);
      state = custom.startedAt ? 'working' : 'paused';
      stateText = custom.startedAt ? '計時中' : (custom.accum ? '已暫停' : '準備開始');
      $('notice').hidden = true;
    }

    const [ip, dp] = earned.toFixed(2).split('.');
    setText($('heroInt'), Number(ip).toLocaleString('en-US'));
    setText($('heroDec'), '.' + dp);
    setText($('clock'), clockText);
    $('pill').dataset.state = state;
    setText($('pillText'), stateText);

    /* month */
    const m = getMonthProgress(now);
    const pct = (m.progress * 100).toFixed(2);
    const monthEarned = Math.max(0, cfg.salary) * m.progress;
    setText($('monthTitle'), m.month + ' 月進度');
    setText($('monthPassed'), '這個月已經過了 ' + m.elapsedDays + ' 天');
    $('monthFill').style.width = pct + '%';
    $('monthEarnFill').style.width = pct + '%';
    $('monthTrack').setAttribute('aria-valuenow', pct);
    setText($('mStart'), m.month + '/1');
    setText($('mEnd'), m.month + '/' + m.totalDays);
    setText($('mPct'), pct + '%');
    setText($('monthEarned'), money(monthEarned));
    setText($('monthTotal'), money(cfg.salary, 0));

    /* goal */
    const g = cfg.goal;
    $('goalFill').style.width = (Math.min(1, earned / Math.max(1, g.amount)) * 100).toFixed(1) + '%';
    const msg = $('goalMsg');
    if (earned >= g.amount) {
      msg.className = 'goal-msg done';
      setText(msg, '今天已經賺到了，下班可以安心去買!');
    } else {
      msg.className = 'goal-msg';
      const gap = g.amount - earned;
      setText(msg, '還差 NT$' + money(gap) + (state === 'working' ? '，約 ' + Math.ceil(gap / d.perSec / 60) + ' 分鐘' : ''));
    }

    /* buy */
    buyRefs.forEach((r) => {
      const ratio = earned / r.price;
      const c = Math.floor(ratio);
      setText(r.n, c.toLocaleString('en-US'));
      r.fill.style.width = ((ratio - c) * 100).toFixed(1) + '%';
    });
  }

  function renderStatic() {
    const d = derived();
    setText($('sSec'), d.perSec.toFixed(4));
    setText($('sMin'), (d.perSec * 60).toFixed(2));
    setText($('sHour'), money(d.perSec * 3600, 0));
    setText($('sDay'), money(d.daily, 0));
    setText($('startLbl'), cfg.start);
    setText($('endLbl'), cfg.end);
    setText($('goalName'), cfg.goal.name);
    setText($('goalAmt'), 'NT$' + money(cfg.goal.amount, 0));
    setText($('foot'), '以月薪 NT$' + money(cfg.salary, 0) + '、每月 ' + cfg.days + ' 個工作天計算');
  }

  /* ---------- mode toggle ---------- */
  function setMode(next) {
    mode = next;
    $('modeToday').setAttribute('aria-pressed', next === 'today');
    $('modeCustom').setAttribute('aria-pressed', next === 'custom');
    $('dayBar').hidden = next !== 'today';
    $('controls').hidden = next !== 'custom';
    setText($('lead'), next === 'today' ? '你以為你失去的是時間，其實你得到的是薪水' : '從按下開始到現在，你已經賺了');
    tick();
  }
  $('modeToday').onclick = () => setMode('today');
  $('modeCustom').onclick = () => setMode('custom');
  $('noticeCustom').onclick = () => setMode('custom');

  $('cStart').onclick = () => {
    if (custom.startedAt) { custom.accum += (Date.now() - custom.startedAt) / 1000; custom.startedAt = null; $('cStart').textContent = '繼續'; }
    else { custom.startedAt = Date.now(); $('cStart').textContent = '暫停'; }
    tick();
  };
  $('cReset').onclick = () => { custom.accum = 0; custom.startedAt = null; $('cStart').textContent = '開始'; tick(); };

  /* ---------- fullscreen ---------- */
  $('fsBtn').onclick = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  };

  /* ---------- goal edit ---------- */
  let goalEditing = false;
  function setGoalEditing(on) {
    goalEditing = on;
    $('goalView').hidden = on;
    $('goalForm').hidden = !on;
    $('goalEditText').textContent = on ? '取消' : '編輯';
    if (on) { $('gName').value = cfg.goal.name; $('gAmount').value = cfg.goal.amount; $('gName').focus(); }
  }
  $('goalEdit').onclick = () => setGoalEditing(!goalEditing);
  $('gSave').onclick = () => {
    cfg.goal = { name: $('gName').value.trim() || '今日小目標', amount: Math.max(1, Number($('gAmount').value) || 1) };
    persist(); renderStatic(); setGoalEditing(false); tick();
  };

  /* ---------- buy edit ---------- */
  let buyEditing = false;
  let draft = [];

  function itemRow(it) {
    const sel = h('select', { 'data-k': 'icon', 'aria-label': '圖示' },
      ICON_OPTS.map(([v, l]) => h('option', { value: v, selected: v === it.icon }, l)));
    return h('div', { class: 'item-row' },
      h('label', { class: 'field f-icon' }, '圖示', sel),
      h('label', { class: 'field f-unit' }, '單位', h('input', { 'data-k': 'unit', maxlength: 3, value: it.unit || '', placeholder: '杯', autocomplete: 'off' })),
      h('label', { class: 'field f-name' }, '名稱', h('input', { 'data-k': 'name', maxlength: 10, value: it.name || '', placeholder: '珍奶', autocomplete: 'off' })),
      h('label', { class: 'field f-price' }, '價格 NT$', h('input', { 'data-k': 'price', type: 'number', inputmode: 'numeric', min: 1, step: 5, value: it.price == null ? '' : it.price })),
      h('button', { class: 'del', type: 'button', 'aria-label': '刪除品項', html: svg('trash'), onclick: function () { collectDraft(); draft.splice([...$('buyRows').children].indexOf(this.closest('.item-row')), 1); renderRows(); } })
    );
  }

  function renderRows(focusLast) {
    const rows = $('buyRows');
    rows.replaceChildren(...draft.map(itemRow));
    $('buyAdd').disabled = draft.length >= MAX_ITEMS;
    $('buyAdd').title = draft.length >= MAX_ITEMS ? '最多 ' + MAX_ITEMS + ' 個品項' : '';
    if (focusLast && rows.lastElementChild) rows.lastElementChild.querySelector('[data-k="name"]').focus();
  }

  function collectDraft() {
    draft = [...$('buyRows').children].map((row) => ({
      icon: row.querySelector('[data-k="icon"]').value,
      unit: row.querySelector('[data-k="unit"]').value.trim(),
      name: row.querySelector('[data-k="name"]').value.trim(),
      price: row.querySelector('[data-k="price"]').value,
    }));
    return draft;
  }

  function setBuyEditing(on) {
    buyEditing = on;
    $('buyGrid').hidden = on;
    $('buyEditor').hidden = !on;
    $('buyEditText').textContent = on ? '取消' : '編輯';
    $('buyErr').textContent = '';
    if (on) { draft = clone(cfg.items); renderRows(); }
  }
  $('buyEdit').onclick = () => setBuyEditing(!buyEditing);
  $('buyAdd').onclick = () => {
    collectDraft();
    if (draft.length >= MAX_ITEMS) return;
    draft.push({ icon: 'bag', unit: '', name: '', price: '' });
    renderRows(true);
  };
  $('buyReset').onclick = () => { draft = clone(DEFAULT_ITEMS); $('buyErr').textContent = ''; renderRows(); };
  $('buySave').onclick = () => {
    const items = collectDraft();
    if (!items.every((i) => i.name && Number(i.price) > 0)) {
      $('buyErr').textContent = '每個品項都需要填名稱，價格要大於 0。';
      return;
    }
    cfg.items = items.map((i) => ({ icon: i.icon, unit: i.unit, name: i.name, price: Number(i.price) }));
    persist(); setBuyEditing(false); renderBuy(); tick();
  };

  /* ---------- settings dialog ---------- */
  const dlg = $('dlg');
  function openSettings() {
    $('fSalary').value = cfg.salary; $('fDays').value = cfg.days;
    $('fStart').value = cfg.start; $('fEnd').value = cfg.end;
    $('fLunch').checked = cfg.lunch; $('fLs').value = cfg.ls; $('fLe').value = cfg.le;
    $('err').textContent = '';
    dlg.showModal();
  }
  $('setBtn').onclick = openSettings;
  $('noticeAdjust').onclick = openSettings;
  $('dCancel').onclick = () => dlg.close();
  $('dSave').onclick = () => {
    const next = {
      salary: Math.max(0, Number($('fSalary').value) || 0),
      days: Math.min(31, Math.max(1, Number($('fDays').value) || 22)),
      start: $('fStart').value || '09:00', end: $('fEnd').value || '18:00',
      lunch: $('fLunch').checked, ls: $('fLs').value || '12:00', le: $('fLe').value || '13:00',
    };
    if (toSec(next.end) <= toSec(next.start)) { $('err').textContent = '下班時間必須晚於上班時間'; return; }
    if (next.lunch && toSec(next.le) <= toSec(next.ls)) { $('err').textContent = '午休結束必須晚於午休開始'; return; }
    Object.assign(cfg, next);
    persist(); renderStatic(); dlg.close(); tick();
  };

  /* ---------- theme ---------- */
  const THEME_KEY = 'salary-timer-theme';
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  const effective = () => theme || (mq.matches ? 'dark' : 'light');
  function applyTheme() {
    if (theme) document.documentElement.dataset.theme = theme;
    else delete document.documentElement.dataset.theme;
    const dark = effective() === 'dark';
    $('themeBtn').innerHTML = svg(dark ? 'sun' : 'moon');
    $('themeBtn').setAttribute('aria-label', dark ? '切換成淺色模式' : '切換成深色模式');
  }
  $('themeBtn').onclick = () => {
    theme = effective() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    applyTheme();
  };
  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  applyTheme();

  renderStatic();
  renderBuy();
  tick();
  setInterval(tick, 200);
})();
</script>
</body>
</html>
